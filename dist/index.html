    <script type="application/ld+json">
      {

    <script>
      try{document.documentElement.dataset.theme=localStorage.getItem('chenne-theme')==='light'?'light':'dark'}catch{}
    </script>
    <style>
      #initial-loader{display:none}
      html.game-loading #initial-loader{position:fixed;inset:0;z-index:10000;display:grid;place-content:center;justify-items:center;gap:20px;padding:24px;text-align:center;background:#0d1512;color:#eee8d8;font:16px/1.5 system-ui,sans-serif}
      html[data-theme="light"].game-loading #initial-loader{background:#f8f6ef;color:#26362c}
      html.game-loading{overflow:hidden}
      html.game-loading #app{visibility:hidden}
      #initial-loader h1{font:clamp(32px,7vw,44px)/1.15 Georgia,serif;letter-spacing:-1px;margin:0}
      #initial-loader p{margin:0;max-width:30ch;font-size:14px;opacity:.7}
      .loading-sow{display:flex;gap:13px;align-items:center;height:58px;margin-bottom:8px;color:#c7aa6e}
      .loading-sow span{position:relative;display:block;width:12px;height:12px;border:1px solid currentColor;border-radius:50%;animation:sow-glow 1.8s ease-in-out infinite;animation-delay:var(--delay)}
      .loading-sow span::after{content:"";position:absolute;inset:2px;background:currentColor;border-radius:50%;animation:sow-drop 1.8s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:var(--delay)}
      html[data-theme="light"] .loading-sow{color:#8b682b}
      #loader-retry{color:inherit;border:1px solid #897447;background:transparent;border-radius:6px;padding:12px 24px;font:inherit;cursor:pointer}
      #loader-retry[hidden]{display:none}
      @keyframes sow-drop{0%,65%,100%{transform:translateY(0) scale(.7);opacity:.25}20%{transform:translateY(-20px) scale(.9);opacity:1}38%{transform:translateY(0) scale(1);opacity:1}48%{transform:translateY(-3px) scale(.85);opacity:.8}}
      @keyframes sow-glow{0%,65%,100%{opacity:.4}25%,45%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.loading-sow span,.loading-sow span::after{animation:none}}
    </style>
    <script>
      document.documentElement.classList.add('game-loading');
      window.chenneLoadFailed=()=>{const message=document.getElementById('loader-message');if(message){message.textContent='Loading is taking longer than expected. Check your connection or try again.';document.getElementById('loader-retry').hidden=false;}};
      window.chenneLoadTimer=setTimeout(window.chenneLoadFailed,15000);
    </script>

  <body>
    <div id="initial-loader" aria-label="Loading Chenne Mane">
      <div class="loading-sow" aria-hidden="true">
        <span style="--delay:-1.8s"></span><span style="--delay:-1.66s"></span
        ><span style="--delay:-1.52s"></span><span style="--delay:-1.38s"></span
        ><span style="--delay:-1.24s"></span><span style="--delay:-1.1s"></span
        ><span style="--delay:-0.96s"></span>
      </div>
      <h1>Chenne Mane</h1>
      <p id="loader-message" role="status" aria-live="polite">Preparing your board…</p>
      <button id="loader-retry" hidden onclick="location.reload()">Try again</button>
    </div>
    <script>
      window.chenneStylesReady=Promise.all(Array.from(document.querySelectorAll('[data-game-style]'),link=>link.sheet?Promise.resolve():new Promise((resolve,reject)=>{link.addEventListener('load',resolve,{once:true});link.addEventListener('error',()=>reject(new Error('Styles could not load')),{once:true});})));
      window.chenneStylesReady.catch(window.chenneLoadFailed);
    </script>
    <div id="app"></div>
    <noscript><p>Please enable JavaScript to play Chenne Mane.</p></noscript>
    <script type="module" src="/app.js?v=14" onerror="window.chenneLoadFailed()"></script>
  </body>
